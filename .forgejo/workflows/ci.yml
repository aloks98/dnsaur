name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: tiny-no-docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Enable corepack
        run: corepack enable
      # A fixed path passed to install, rather than asking pnpm where its
      # store is and feeding that to the cache.
      #
      # That indirection is what broke the build: the resolve step was the
      # first pnpm invocation in the job, so corepack was still fetching the
      # pinned pnpm at that moment. Anything it printed — or a non-zero exit
      # — left the command substitution empty, while `echo` still exited 0.
      # The step went green having written `path=`, and the cache action
      # then failed with "Input required and not supplied: path".
      #
      # A literal both steps agree on has nothing to resolve, nothing to run
      # early, and no way to end up empty. It also sidesteps the version
      # suffix (…/store/v11) that made hardcoding pnpm's *default* unwise.
      #
      # The lockfile hash is the right key here, unlike the Playwright cache
      # below: the store holds exactly the resolved dependency set, so a
      # changed lockfile genuinely means different contents. restore-keys is
      # what stops that being expensive — on a miss it falls back to the
      # newest previous store and pnpm fetches only what actually changed.
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store
      - name: Lint
        working-directory: web
        run: pnpm lint
      - name: Format check
        working-directory: web
        run: pnpm format:check
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck
      - name: Test
        working-directory: web
        run: pnpm test
      - name: Build
        working-directory: web
        run: pnpm build
      # v3, deliberately. v4 cannot work here: it bundles @actions/artifact
      # v2, which refuses outright to run against any host that isn't
      # github.com — it reports the instance as GHES and exits before making
      # a request. The guard is client-side and unconditional, so this is
      # not a capability gap; the runner serves the v4 API fine, the action
      # just declines to talk to it.
      #
      # v3 predates that rewrite and speaks the v1 artifact API the runner
      # actually implements. It is also what upstream tells GHES users to
      # do, and what forgejo/upload-artifact — a self-described "temporary
      # fork until v4 supports GHES" — exists to work around. Preferring the
      # official action at v3 over a stopgap fork at v4 means one fewer
      # unmaintained dependency. Keep upload and download on the same major.
      - uses: actions/upload-artifact@v3
        with:
          name: web-dist
          path: web/dist

  # Deliberately NOT `needs: web`: the Go build/vet/lint don't depend on real
  # dashboard assets (web/dist/.gitkeep alone satisfies the //go:embed), so a
  # frontend hiccup must never silently skip backend verification on a PR.
  checks:
    runs-on: tiny-no-docker
    steps:
      - uses: actions/checkout@v4
      # setup-go's built-in cache keys on the go.sum hash with no fallback,
      # and exposes no way to give it one. A dependency bump therefore misses
      # outright ("Cache is not found"), and golangci-lint then loads and
      # compiles the whole module from nothing — measured cold at 40s and
      # ~1.5 GB peak on a 16-core box, which on this runner is what turned
      # the job into a 13-minute one that died without printing a line.
      #
      # Off, in favour of the explicit cache below, which can fall back.
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache: false }
      # Same shape and the same reasoning as the pnpm store above: the
      # lockfile hash is the right key, because the build cache's contents
      # follow the resolved dependency set — and restore-keys is what stops a
      # changed go.sum being expensive, since a miss falls back to the newest
      # previous cache and only what actually moved gets recompiled.
      #
      # The lint action keeps its own cache under its own key; this is only
      # the Go build and module caches it stands on.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-
      - name: Lint
        uses: https://github.com/golangci/golangci-lint-action@v8
        with: { version: v2.12 }
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build -ldflags "-X main.Version=${GITHUB_SHA::7}" ./cmd/dnsaur

  # Same as `checks`: no `needs: web`. No Go test asserts on real dist content.
  test:
    runs-on: medium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      # DNSAUR_TEST_REQUIRE_POSTGRES turns "no postgres, its halves will
      # skip" from a line on stderr into a failed run (internal/storetest).
      # This runner has Docker, so a suite that skips half of internal/store,
      # internal/zones and internal/app here is not a green suite — and the
      # only trace it used to leave was that stderr line, in the middle of a
      # passing log.
      - name: Race tests
        env: { DNSAUR_TEST_REQUIRE_POSTGRES: "1" }
        # pipefail, or `tee` succeeding would report a failed suite as green.
        # -count=1, because a race suite served from the build cache detects
        # nothing: `go test` replays the previous PASS without running the
        # binary, and a race that only shows up sometimes never gets the
        # chance to.
        run: |
          set -o pipefail
          go test -race -cover -count=1 ./... | tee /tmp/cover.txt
      # Per-package coverage where the run reports it, rather than in the
      # scrollback. Not a gate: nothing fails on a number moving.
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Go coverage'
            echo '```'
            grep -E 'coverage:|no test files' /tmp/cover.txt || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

  # Playwright smoke test (web/e2e/smoke.spec.ts) against the real embedded
  # build: webServer (web/playwright.config.ts) builds the actual dnsaur
  # binary over the web-dist artifact from the `web` job and runs it, then
  # a browser drives first-run setup → login → add a DNS record → dark
  # mode persistence. Best-effort, not a merge gate — continue-on-error so
  # a runner without reliable network access to download Chromium (or any
  # other environment quirk) doesn't block the pipeline; see
  # web/README.md's "End-to-end smoke test" section for the local-only
  # fallback (`pnpm test:e2e`) this mirrors.
  e2e:
    runs-on: medium
    needs: web
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Enable corepack
        run: corepack enable
      # Same store, same key as the web job — so whichever of the two runs
      # first populates it and the other gets a hit. See there for why the
      # path is a literal rather than read back from pnpm.
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile --store-dir ~/.pnpm-store
      - uses: actions/download-artifact@v3
        with:
          name: web-dist
          path: web/dist
      # Keyed on Playwright's own version, not on the lockfile hash. The
      # browser build is pinned to the Playwright release, so any other
      # dependency changing has no bearing on it — hashing the lockfile
      # would throw away a good Chromium every time an unrelated package
      # moved, which on an active branch is most pushes.
      #
      # Reads it from the installed package rather than parsing the
      # lockfile, so it is whatever pnpm actually resolved. Runs after the
      # Install step for that reason.
      - name: Resolve Playwright version
        id: playwright
        working-directory: web
        run: |
          # Checked rather than interpolated blind. An empty value here does
          # not error the way an empty `path` does — it yields a valid but
          # constant key that silently never invalidates on a Playwright
          # upgrade, which is worse than a red step.
          version="$(node -p "require('@playwright/test/package.json').version")"
          [ -n "$version" ] || { echo "could not resolve the Playwright version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Bare, like every other action here — it resolves to the instance's
      # own actions/cache mirror. v4 is fine for cache; it is only the
      # artifact actions that carry the github.com-only guard, which is why
      # those are pinned a major back.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ steps.playwright.outputs.version }}
      # `install` alone on a cache hit: the browser is already there and it
      # exits in about a second. `--with-deps` stays because the apt
      # packages live outside ~/.cache and are not cacheable this way; that
      # part is quick next to the ~130 MB download it now skips.
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Smoke test
        working-directory: web
        run: pnpm test:e2e
      # continue-on-error above means a failure leaves no other trace, so
      # always keep the report + traces (playwright.config.ts sets
      # trace: "on-first-retry", and CI retries once) — otherwise the smoke
      # test can rot silently.
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
