// What CI's throwaway engine starts with (.forgejo/workflows/ci.yml, job
// test-kea). Kea will not start without a valid configuration, and
// TestRealEngine replaces this one with a rendered config on its first
// command — so this only has to be startable.
//
// The hook library is named for the test's benefit: it reads the hook
// directory out of config-get the way dnsaur does, rather than guessing at a
// path on the machine it is running on, which here is not the machine the
// engine is running on. The path is Debian's amd64 one, and the medium
// runner is amd64.
{
  "Dhcp4": {
    "interfaces-config": { "interfaces": [ ] },
    "control-socket": { "socket-type": "unix", "socket-name": "/run/kea/kea.sock" },
    "lease-database": { "type": "memfile", "persist": true, "name": "/var/lib/kea/kea-leases4.csv" },
    "valid-lifetime": 3600,
    "hooks-libraries": [
      { "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so" }
    ],
    "subnet4": [ ]
  }
}
