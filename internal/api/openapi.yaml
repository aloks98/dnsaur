        ruleset compiles only from the lists assigned to it, so a list that
        exists but is assigned nowhere filters nothing while still reporting
        itself enabled with a full entry_count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, kind]
              properties:
                url: { type: string, description: http(s) URL of the list }
                name:
                  type: string
                  maxLength: 120
                  description: >
                    Optional label. Blank or omitted stores blank, which
                    reads back as a name derived from the URL.
                kind: { type: string, enum: [block, allow] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
        "400":
          description: >
            url must be http(s), kind must be block or allow, or name too
            long (max 120)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "409":
          description: that list URL is already subscribed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /filters/lists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Filters]
      summary: Enable, disable, or rename a filter list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Either field alone is a valid patch, but at least one is
                required. url and kind are deliberately immutable — changing
                either would silently invalidate the on-disk cache and the
                compiled ruleset — and sending one is rejected rather than
                ignored.
              minProperties: 1
              anyOf:
                - required: [enabled]
                - required: [name]
              properties:
                enabled: { type: boolean }
                name:
                  type: string
                  maxLength: 120
                  description: >
                    Blank resets the list to its URL-derived default name
                    rather than clearing it.
      responses:
        "204":
          description: No Content
        "400":
          description: >
            enabled or name required, or name too long (max 120)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Filters]
      summary: Delete a filter list
      responses:
        "204":
          description: No Content
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /filters/rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Filters]
      summary: Delete a per-group rule
      responses:
        "204":
          description: No Content
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /filters/refresh:
    post:
      tags: [Filters]
      summary: Trigger an immediate, asynchronous refresh of all filter lists
      responses:
        "202":
          description: Accepted, refresh started in background
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: refreshing }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"

  /zones:
    get:
      tags: [Zones]
      summary: List authoritative zones
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zone" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Zones]
      summary: Create a zone
      description: >
        name alone is enough to create a working zone: soa_ns defaults to
        "ns.<name>", soa_mbox to "hostadmin.<name>", and soa_refresh,
        soa_retry, soa_expire and soa_minimum default to 900, 300, 604800
        and 900 seconds respectively. type defaults to primary.


        Creating a primary zone also creates its apex NS record, pointed
        at soa_ns — RFC 2181 §10.1 requires an authoritative zone to carry
        NS records at its apex, so a zone is never left without one. That
        insert is best-effort: the zone itself is already committed by the
        time it runs, so a failure there is logged, not surfaced, and
        GET /zones/{id}/records is the way to confirm the NS record exists.


        A secondary is created empty and gets no apex NS: its contents are
        its primary's, arriving whole on the first transfer. It requires a
        non-empty primaries, and tsig_key_id when set must name an
        existing TSIG key. A stub likewise requires primaries (and may set
        tsig_key_id) but fetches by ordinary query rather than transfer,
        and also gets no apex NS. A forwarder gets no apex NS either and
        answers nothing of its own — it may set forward_to instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: apex domain name, e.g. example.com }
                type:
                  type: string
                  enum: [primary, secondary, forwarder, stub]
                  description: >
                    defaults to primary. internal is rejected with 400 —
                    see the Zone schema's type field.
                enabled: { type: boolean, default: true }
                primaries:
                  type: string
                  description: >
                    required and non-empty for a secondary or stub,
                    rejected on any other type; see the Zone schema's
                    primaries field for the format
                tsig_key_id:
                  type: integer
                  format: int64
                  description: >
                    secondary or stub only; optional, and when set must
                    name an existing TSIG key
                allow_transfer:
                  type: string
                  description: >
                    optional; empty (the default) means deny every AXFR
                    request. Applies to both primary and secondary, and
                    is rejected on forwarder and stub — see the Zone
                    schema's allow_transfer field for the format; a
                    key:<name> entry must name an existing TSIG key.
                notify_to:
                  type: string
                  description: >
                    optional; empty (the default) means notify nobody.
                    Applies to both primary and secondary, and is
                    rejected on forwarder and stub — see the Zone
                    schema's notify_to field for the format; a key:<name>
                    entry must name an existing TSIG key.
                forward_to:
                  type: string
                  description: >
                    forwarder only; rejected on every other type — see
                    the Zone schema's forward_to field for the format.
                soa_ns: { type: string, description: 'defaults to "ns.<name>"' }
                soa_mbox: { type: string, description: 'defaults to "hostadmin.<name>"' }
                soa_refresh: { type: integer, format: int64, description: seconds; defaults to 900 }
                soa_retry: { type: integer, format: int64, description: seconds; defaults to 300 }
                soa_expire: { type: integer, format: int64, description: seconds; defaults to 604800 }
                soa_minimum: { type: integer, format: int64, description: seconds; defaults to 900 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
        "400":
          description: >
            invalid json; name must be a valid domain name; type is set
            to something other than primary, secondary, forwarder or stub
            ("only primary, secondary, forwarder and stub zones are
            supported"); a secondary's or stub's primaries is missing or
            malformed; primaries or tsig_key_id is set on a zone that is
            not a secondary or stub; tsig_key_id names no existing key;
            allow_transfer is set on a forwarder or stub, is malformed, or
            names a TSIG key that does not exist; notify_to is set on a
            type other than primary or secondary, is malformed, or names
            a TSIG key that does not exist; or forward_to is set on a
            type other than forwarder, or is malformed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "409":
          description: a zone with that name already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /zones/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Zones]
      summary: Get a zone
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [Zones]
      summary: Update a zone
      description: >
        Every property is optional; only fields present are changed. Same
        name validation as create applies when name is sent. soa_ttl is
        not editable here — see the Zone schema. type, if sent, must be
        primary, secondary, forwarder or stub, or the request is rejected
        with 400 regardless of the zone's current type.


        A zone of type internal — the RFC 6303 built-ins seeded at
        migration, see the Zone schema's type field — rejects the whole
        request with 409, checked right after the type validation above
        and before any field is applied.


        primaries, tsig_key_id and forward_to are validated against the
        zone as it will be, not against the request: patching a zone to
        secondary without giving it primaries is rejected, and so is
        clearing the primaries of a zone that is already one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: apex domain name, e.g. example.com }
                type: { type: string, enum: [primary, secondary, forwarder, stub] }
                enabled: { type: boolean }
                soa_ns: { type: string }
                soa_mbox: { type: string }
                soa_refresh: { type: integer, format: int64, description: seconds }
                soa_retry: { type: integer, format: int64, description: seconds }
                soa_expire: { type: integer, format: int64, description: seconds }
                soa_minimum: { type: integer, format: int64, description: seconds }
                primaries: { type: string, description: 'see the Zone schema''s primaries field' }
                tsig_key_id: { type: integer, format: int64 }
                allow_transfer: { type: string, description: 'see the Zone schema''s allow_transfer field' }
                notify_to:
                  type: string
                  description: >
                    see the Zone schema's notify_to field. Absent leaves it
                    unchanged; "" clears it (notify nobody).
                forward_to:
                  type: string
                  description: >
                    see the Zone schema's forward_to field. Absent leaves
                    it unchanged; "" clears it (names no upstreams).
      responses:
        "204":
          description: No Content
        "400":
          description: >
            bad id, invalid json, name must be a valid domain name, type
            is set to something other than primary, secondary, forwarder
            or stub ("only primary, secondary, forwarder and stub zones
            are supported"), the zone would be left a secondary or stub
            without valid primaries, primaries or tsig_key_id is set on a
            zone that is not a secondary or stub, tsig_key_id names no
            existing key, allow_transfer is set on a forwarder or stub /
            is malformed / names a TSIG key that does not exist,
            notify_to is set on a type other than primary or secondary /
            is malformed / names a TSIG key that does not exist, or
            forward_to is set on a type other than forwarder / is
            malformed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            the zone is type internal ("built-in zones cannot be
            changed"); or a zone with that name already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Zones]
      summary: Delete a zone
      description: >
        Deletes every record in the zone along with it (ON DELETE
        CASCADE), and retires the PTR records those records owned from
        whichever reverse zone holds them — those live in a different
        zone, which the cascade cannot reach, and a PTR is only removed
        while it still points at the name being deleted, so a
        hand-written PTR or one owned by another zone's name survives. A
        zone of type internal — the RFC 6303 built-ins seeded at
        migration, see the Zone schema's type field — cannot be deleted;
        the request is rejected with 409.
      responses:
        "204":
          description: No Content
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: the zone is type internal ("built-in zones cannot be changed")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /zones/{id}/refresh:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [Zones]
      summary: Pull a secondary or stub zone from its master now
      description: >
        Runs one pull immediately, whatever the SOA schedule says, and
        answers only once it has finished — so the response is the
        outcome, not an acknowledgement. A secondary transfers the whole
        zone by AXFR; a stub fetches only its apex SOA and NS by ordinary
        query. Those two types only: a primary is authored here and a
        forwarder names its upstreams outright, so neither has a master to
        ask, and both are refused with 400.


        A pull that fails changes nothing at all: the zone keeps the
        records, the serial and the refreshed_at it already had. So a 502
        always means "still serving whatever it had", never a
        half-applied zone.


        The scheduler runs the same pull on the zone's own SOA
        refresh/retry timers without anyone asking; this endpoint exists
        for the case where waiting for the next tick is not the answer. A
        pull already in flight for this zone is waited for rather than
        skipped, so a request may take as long as that one has left.


        The dashboard's "Refresh now" button is the only caller. Note the
        server keeps no persistent record of a failed attempt — the
        scheduler's own view of it (last error, next attempt) is
        process-local and does not survive a restart — which is why the
        error text here is returned verbatim: this response is the only
        account of a failure the API ever gives.
      responses:
        "200":
          description: the pull completed — a secondary's records replaced, a stub's delegation installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  primary:
                    type: string
                    description: >
                      the master that answered, as host:port — one of the
                      zone's primaries, not the whole list
                    example: 203.0.113.9:53
                  serial: { type: integer, format: int64, description: the master's serial, adopted verbatim }
                  records: { type: integer, description: rows the zone holds after the install — for a stub, its NS set and the addresses stored beside it }
                  refreshed_at: { type: integer, format: int64, description: unix ms }
                  expires_at:
                    type: integer
                    format: int64
                    description: >
                      unix ms, and always 0 for a stub — a stub is never
                      given an expiry, because its NS set is routing
                      information rather than data held on loan. Render it
                      as "does not expire", never as an expiry at the epoch.
        "400":
          description: bad id, or the zone has no master ("only secondary and stub zones pull from a master")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: >
            the transfer failed. The message is the transfer's own error,
            verbatim, and names every primary that was tried — a refused
            connection, a rejected TSIG, an rcode, a malformed stream, or
            a zone this server would not accept. The zone is unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable, or this server is running without the zone scheduler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /zones/{id}/records:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, description: zone id }
    get:
      tags: [Zones]
      summary: List a zone's records
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ZoneRecord" }
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: zone not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Zones]
      summary: Create a record in a zone
      description: >
        Rejected with 409 before the body is even read if the zone's
        records are authored somewhere other than here: type internal —
        the RFC 6303 built-ins seeded at migration; type secondary, whose
        records arrive whole from its primary on every transfer; or type
        stub, whose records are the NS set it fetches from its master.
        The last two would both replace anything written by hand at the
        next refresh. A forwarder is not among them — nothing overwrites
        its records, because it has no master and answers from none of
        them. See the Zone schema's type field.


        rdata is DNS presentation format — the rdata portion only, e.g.
        "192.168.150.28" for A, "10 mail.example.com." for MX, "0 issue
        \"letsencrypt.org\"" for CAA, or "host.example.com." for PTR (a
        domain name, RFC 1034 — not the address). It is validated by
        handing "<name> <ttl> IN <type> <rdata>" to the same DNS parser
        (miekg/dns) that builds the RR served to resolvers, so a 400 here
        carries that parser's own error text, not a generic message — any
        type it can parse is accepted without an API change, and an
        accepted record is by construction a servable one.


        What is stored is that parser's own spelling of the value, not the
        submitted text, so a later GET may return a different string:
        "nas.example.com" reads back "nas.example.com.", "hello" reads back
        "\"hello\"", "2001:0db8::0001" reads back "2001:db8::1". The record
        answers identically either way. It is stored this way because rdata
        is read in two places that disagree about the same text: a name in
        rdata is absolute here, but a name without a trailing dot in an
        exported zone file is relative to the zone, so only the parser's
        spelling means one thing in both.


        A bare "@" in rdata is the zone apex, the same thing it is in a
        zone file: {"type":"MX","rdata":"10 @"} is stored as "10 <zone>.".
        Where the value is text rather than a name — a TXT — "@" stays the
        character it is, on this path and on import alike.


        name is zone-relative ("@", "bifrost", "*", "*.nexus"); omitted or
        equal to the zone's own name means the apex. A name that already
        carries the zone's apex as a suffix (e.g. "www.example.com" typed
        against zone "example.com") has that suffix stripped rather than
        doubled. It must be a domain name the zone's export can carry:
        whitespace, ';', '"', '(', ')', '\', '/', an empty label and a
        leading '$' are refused with 400, because each of them changes how
        the exported line reads back. A leading underscore is fine.


        type must be one the server can serve. SOA is refused: a zone's SOA
        lives on the zone row (PATCH /zones/{id}), and a second one among
        the records would be exported beside it and make the file
        unloadable. So is a type miekg/dns has no name for, including RFC
        3597's TYPE65280 spelling — nothing could match it, since the
        stored type is what a query is matched against.


        Three write conflicts are rejected with 409 rather than accepted
        and left to break resolution later, checked in this order:
          - a CNAME at the zone apex (RFC 1912 §2.4)
          - a CNAME landing beside another record at the same name, or a
            record landing beside an existing CNAME, in either order
            (RFC 1034 §3.6.2 — a CNAME must be the only record at its name)
          - a TTL that doesn't match the rest of the RRSet already at this
            name and type (RFC 2181 §5.2 — every RR in an RRSet must share
            one TTL)


        If type is A or AAAA and enabled is not false, this write also
        maintains a matching PTR server-side, in the same request — no
        second call needed. (A record created with enabled: false gets no
        PTR: it answers nothing forward, so there is nothing for a
        reverse answer to mirror.) It writes the PTR only into a primary,
        enabled reverse zone that already covers the address (the most
        specific such zone wins); it never creates a zone, and it is
        silent when no reverse zone covers the address. If that address
        already has a PTR — from an earlier write or one entered by hand
        — the existing PTR is left alone; first writer keeps the address.
        This side effect can change a *different* zone's soa_serial with
        no direct write to that zone, and it never fails this request: if
        the PTR itself can't be written, only that is logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, rdata]
              properties:
                name: { type: string, description: 'zone-relative owner name; omitted means the apex ("@")' }
                type: { type: string, description: "DNS RR type, e.g. A, AAAA, CNAME, MX, TXT, CAA, NS, PTR" }
                ttl:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 2147483647
                  description: >
                    seconds; above 2147483647 is rejected (RFC 2181 §8 — a
                    resolver would read it back via two's-complement
                    wraparound, not as typed)
                rdata: { type: string, description: DNS presentation format, rdata portion only }
                enabled: { type: boolean, default: true }
                comment: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
        "400":
          description: >
            invalid json; a name the zone's export cannot carry; type SOA
            or a type the server cannot serve; ttl above 2147483647 (RFC
            2181 §8); or rdata that fails to parse against name, ttl and
            type — message is the DNS parser's own error text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: zone not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            the zone is type internal ("built-in zones cannot be
            changed"), type secondary ("a secondary zone's records come
            from its primary; change them there") or type stub ("a stub
            zone's records are the NS set it fetches from its master;
            change them there"), checked before the body is parsed; or,
            once the body is valid: CNAME at the zone apex (RFC 1912
            §2.4); CNAME beside another record at the same name in either
            write order (RFC 1034 §3.6.2); or a TTL that doesn't match the
            rest of the RRSet at this name and type
            (RFC 2181 §5.2) — checked in that order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /zones/{id}/records/{rid}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, description: zone id }
      - name: rid
        in: path
        required: true
        schema: { type: integer, format: int64, description: record id }
    put:
      tags: [Zones]
      summary: Replace a record in a zone
      description: >
        Same rdata validation, 409 conflict rules, and auto-PTR side
        effect as POST /zones/{id}/records — see that operation's
        description, including for the internal-zone 409. rid must belong
        to the zone named by id, or the request 404s the same as an
        unknown record.


        If the record was type A or AAAA before this write, its old PTR
        is retired first — only while it still points at this record's
        old name — and this happens even when the address is unchanged,
        which is what lets a renamed record's PTR follow it to the new
        name. If the record is type A or AAAA after this write, its new
        PTR is then written under the same rules as
        POST /zones/{id}/records (first writer keeps an address; never
        creates a zone).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, rdata]
              properties:
                name: { type: string, description: 'zone-relative owner name; omitted means the apex ("@")' }
                type: { type: string, description: "DNS RR type, e.g. A, AAAA, CNAME, MX, TXT, CAA, NS, PTR" }
                ttl:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 2147483647
                  description: seconds; above 2147483647 is rejected (RFC 2181 §8)
                rdata: { type: string, description: DNS presentation format, rdata portion only }
                enabled: { type: boolean, default: true }
                comment: { type: string }
      responses:
        "204":
          description: No Content
        "400":
          description: >
            bad id, invalid json; a name the zone's export cannot carry;
            type SOA or a type the server cannot serve; ttl above
            2147483647 (RFC 2181 §8); or rdata that fails to parse —
            message is the DNS parser's own error text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: zone not found, or rid is not a record of this zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            the zone is type internal ("built-in zones cannot be
            changed"), type secondary ("a secondary zone's records come
            from its primary; change them there") or type stub ("a stub
            zone's records are the NS set it fetches from its master;
            change them there"), checked before the body is parsed; or,
            once the body is valid: CNAME at the zone apex (RFC 1912
            §2.4); CNAME beside another record at the same name in either
            write order (RFC 1034 §3.6.2); or a TTL that doesn't match the
            rest of the RRSet at this name and type
            (RFC 2181 §5.2) — checked in that order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Zones]
      summary: Delete a record from a zone
      description: >
        rid must belong to the zone named by id, or the request 404s the
        same as an unknown record. Rejected with 409 if the zone's records
        are authored somewhere other than here — type internal, secondary
        or stub, see the Zone schema's type field and the 409 below.


        If the deleted record was type A or AAAA, this also removes its
        PTR from whichever reverse zone holds it — but only while that
        PTR still points at the deleted record's name; one repointed by
        hand, or by a later write to a different name, is left alone.
        This can change a *different* zone's soa_serial with no direct
        write to that zone, and it never fails this request: if the PTR
        can't be removed, only that is logged.
      responses:
        "204":
          description: No Content
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: zone not found, or rid is not a record of this zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            the zone is type internal ("built-in zones cannot be
            changed"), type secondary ("a secondary zone's records come
            from its primary; change them there") or type stub ("a stub
            zone's records are the NS set it fetches from its master;
            change them there")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /zones/{id}/file:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, description: zone id }
    get:
      tags: [Zones]
      summary: Export a zone as a BIND master file
      description: >
        Renders the zone's $ORIGIN/$TTL/SOA and every enabled record as a
        standard BIND master file (RFC 1035 §5). Disabled records are
        omitted: a master file has no way to represent "present but
        disabled".


        A zone of type internal — the RFC 6303 built-ins seeded at
        migration, see the Zone schema's type field — is exportable like
        any other zone; only writes are restricted for built-ins, not
        reads.
      responses:
        "200":
          description: OK
          content:
            text/dns:
              schema: { type: string }
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Zones]
      summary: Replace a zone's contents from a BIND master file
      description: >
        A zone file is the zone, not a patch: anything in the zone and not
        in the file is deleted. Because that is destructive, import is two
        steps — send dry_run true to get the diff, then the same content
        with dry_run false to apply it. Both return the same
        ZoneFileImportResult.


        Records are validated exactly as POST /zones/{id}/records validates
        a hand write, against the file's own records rather than the zone's
        current ones, since the file is what the zone is about to be. Any
        failure rejects the whole file with 422 and no writes, and the
        response names every offending line rather than only the first.


        A file that expands to more than 100,000 records is rejected as a
        whole-file problem: $GENERATE turns one line into up to 65,536
        records, so the 1 MiB body cap bounds the file and not the zone it
        describes.


        The zone's SOA is replaced from the file — its NS, mbox, timers and
        its own TTL — with one exception: the serial becomes max(file,
        current) + 1, so it can never move backwards past what a secondary
        has already seen. A file whose SOA has no TTL (no $TTL directive
        and no TTL on the SOA line, RFC 2308 §4) is rejected, because a
        zone with a zero SOA TTL cannot have its negative answers cached
        (RFC 2308 §5). The SOA replacement is unconditional and does not
        appear in the diff, which covers records only.


        Import does not maintain PTR records, the one exception to the rule
        that A/AAAA writes do. It writes exactly what the file contains, so
        a forward-zone import never rewrites a reverse zone that was not
        named; import the reverse zone's own file to change its PTRs.


        A zone whose records are authored somewhere other than here
        rejects import with 409, like every other write: type internal —
        the RFC 6303 built-ins seeded at migration — type secondary, whose
        contents arrive whole from its primary on every transfer, and type
        stub, whose contents are the NS set it fetches from its master.
        Export (GET) is allowed for all three. Import is the write that
        matters most for the latter two, because it replaces the whole
        zone and the next refresh replaces it right back.


        The request body is limited to 1 MiB — roughly 35,000 records. A
        body over that is rejected with 413 and said to be too large; it
        is never reported as malformed. The cap is not a formatting limit
        but a cost one: each record is validated against every record
        accepted before it, so a file at the cap already takes seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, dry_run]
              properties:
                content:
                  type: string
                  description: the master file, RFC 1035 §5 format.
                dry_run:
                  type: boolean
                  description: >
                    true returns the diff and changes nothing; false applies
                    it. Required, and enforced: a body that omits the field
                    is rejected with 400 rather than defaulted either way.
                    The two-step dry run is the safety mechanism for a
                    destructive replace, so a field the client never sent
                    must not be what selects the destructive branch.
      responses:
        "200":
          description: >
            the diff — applied, or, for a dry run, what applying it would do
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneFileImportResult" }
        "400":
          description: >
            bad id, a body that is not valid JSON, or a body with no dry_run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            the zone is type internal ("built-in zones cannot be
            changed"), type secondary ("a secondary zone's records come
            from its primary; change them there") or type stub ("a stub
            zone's records are the NS set it fetches from its master;
            change them there")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: >
            the request body is over the 1 MiB cap. Distinct from 400,
            which means the body is malformed — a valid zone file that is
            merely too big is never reported as bad JSON.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            the file was rejected and nothing was written; errors names
            every problem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneFileImportResult" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /zones/{id}/notifies:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, description: zone id }
    get:
      tags: [Zones]
      summary: Outbound NOTIFY delivery state, one row per target
      description: >
        One row per host[:port] in the zone's notify_to, reporting whether
        each has acknowledged the zone's current SOA serial. state is
        derived server-side rather than left for the dashboard to infer
        from the other columns — see the ZoneNotify schema's state field —
        so two clients can never disagree about it.


        A zone with no notify_to returns an empty array, never null.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ZoneNotify" }
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: zone not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tsig-keys:
    get:
      tags: [TSIG Keys]
      summary: List TSIG keys
      description: >
        Includes each key's secret -- see the TSIGKey schema's secret field
        for why.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TSIGKey" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [TSIG Keys]
      summary: Create a TSIG key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, algorithm, secret]
              properties:
                name: { type: string }
                algorithm:
                  type: string
                  enum: [hmac-sha1., hmac-sha224., hmac-sha256., hmac-sha384., hmac-sha512.]
                secret: { type: string, description: base64 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
        "400":
          description: >
            name is not a valid domain name, algorithm is not one of the
            five miekg/dns can sign with, or secret is not valid base64
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "409":
          description: a TSIG key with that name already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tsig-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [TSIG Keys]
      summary: Get a TSIG key
      description: >
        Includes the secret -- see the TSIGKey schema's secret field for why.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TSIGKey" }
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [TSIG Keys]
      summary: Replace a TSIG key
      description: >
        Full replacement, not a partial patch -- name, algorithm and secret
        are all required, the same as create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, algorithm, secret]
              properties:
                name: { type: string }
                algorithm:
                  type: string
                  enum: [hmac-sha1., hmac-sha224., hmac-sha256., hmac-sha384., hmac-sha512.]
                secret: { type: string, description: base64 }
      responses:
        "204":
          description: No Content
        "400":
          description: >
            bad id, name is not a valid domain name, algorithm is not one of
            the five miekg/dns can sign with, or secret is not valid base64
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: a TSIG key with that name already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [TSIG Keys]
      summary: Delete a TSIG key
      description: >
        Refused with 409 while any zone's tsig_key_id names this key.
        Deleting it would leave that secondary unable to authenticate its
        transfers, with nothing on the zone to say why — so the key has to
        be released from every zone that uses it first.
      responses:
        "204":
          description: No Content
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: a zone still references this key ("resource in use")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queries:
    get:
      tags: [Queries]
      summary: Search the query log
      parameters:
        - name: from
          in: query
          schema: { type: integer, format: int64, description: unix ms, inclusive lower bound }
        - name: to
          in: query
          schema: { type: integer, format: int64, description: unix ms, inclusive upper bound }
        - name: client
          in: query
          schema: { type: string, description: exact client IP }
        - name: q
          in: query
          schema: { type: string, description: substring match on query name }
        - name: decision
          in: query
          schema: { type: string, enum: [blocked, authoritative, cached, stale, forwarded, error], description: how the query was answered; `authoritative` is an answer from a zone this server holds }
        - name: type
          in: query
          schema: { type: string, description: DNS query type, e.g. A, AAAA }
        - name: limit
          in: query
          schema: { type: integer, description: 0 defaults to 100, capped at 1000 }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    at: { type: integer, format: int64, description: unix ms }
                    instance_id: { type: string }
                    client_ip: { type: string }
                    client_id: { type: integer, format: int64 }
                    q_name: { type: string }
                    q_type: { type: string }
                    decision: { type: string }
                    rule_id: { type: integer, format: int64 }
                    list_id: { type: integer, format: int64 }
                    upstream: { type: string }
                    r_code: { type: string }
                    duration_ms: { type: integer, format: int64 }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queries/tail:
    get:
      tags: [Queries]
      summary: Live-tail the query log as server-sent events
      description: >
        Streams newly-logged query entries as they occur. Each SSE
        "data:" line is a JSON-encoded query log entry (same shape as
        GET /queries items). The connection stays open until the client
        disconnects.
      responses:
        "200":
          description: text/event-stream of query log entries
          content:
            text/event-stream:
              schema: { type: string }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: streaming unsupported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: query log disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stats/overview:
    get:
      tags: [Stats]
      summary: Aggregate query counts over a recent window
      parameters:
        - name: hours
          in: query
          schema: { type: integer, description: lookback window; <=0 defaults to 24 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, format: int64 }
                  blocked: { type: integer, format: int64 }
                  cached: { type: integer, format: int64, description: cached + stale }
                  forwarded: { type: integer, format: int64 }
                  clients: { type: integer, format: int64, description: distinct client count }
                  dropped: { type: integer, format: int64, description: "query log entries discarded since start because the write buffer was full; non-zero means the counts above are undercounts" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stats/timeline:
    get:
      tags: [Stats]
      summary: Query decision counts bucketed over time
      parameters:
        - name: hours
          in: query
          schema: { type: integer, description: lookback window; <=0 defaults to 24 }
      responses:
        "200":
          description: OK, sorted ascending by bucket
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bucket: { type: integer, format: int64, description: unix seconds bucket start }
                    decisions:
                      type: object
                      description: decision -> count
                      additionalProperties: { type: integer, format: int64 }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stats/top:
    get:
      tags: [Stats]
      summary: Top-N values for a metric over a recent window
      parameters:
        - name: metric
          in: query
          required: true
          schema: { type: string, enum: [domain, blocked_domain, client] }
        - name: n
          in: query
          schema: { type: integer, description: "<=0 defaults to 10, capped at 100" }
        - name: hours
          in: query
          schema: { type: integer, description: lookback window; <=0 defaults to 24 }
      responses:
        "200":
          description: OK, sorted descending by count
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    count: { type: integer, format: int64 }
        "400":
          description: metric must be domain, blocked_domain or client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tokens:
    get:
      tags: [Tokens]
      summary: List API tokens owned by the current user
      description: Session tokens are excluded; only kind=api tokens are returned. The token hash is never returned.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    user_id: { type: integer, format: int64 }
                    kind: { type: string, enum: [session, api] }
                    name: { type: string }
                    scope: { type: string, enum: [read, write] }
                    created_at: { type: integer, format: int64 }
                    expires_at: { type: integer, format: int64 }
                    last_used: { type: integer, format: int64 }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Tokens]
      summary: Create an API token
      description: The plaintext token is returned only in this response and cannot be retrieved again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                scope: { type: string, enum: [read, write], description: defaults to write when omitted }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  token: { type: string, description: plaintext token; shown once }
        "400":
          description: name required, or invalid scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"

  /tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Tokens]
      summary: Revoke an API token
      responses:
        "204":
          description: No Content
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
