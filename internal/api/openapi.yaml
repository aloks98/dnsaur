  /zones:
    get:
      tags: [Zones]
      summary: List authoritative zones
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zone" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Zones]
      summary: Create a zone
      description: >
        name alone is enough to create a working zone: soa_ns defaults to
        "ns.<name>", soa_mbox to "hostadmin.<name>", and soa_refresh,
        soa_retry, soa_expire and soa_minimum default to 900, 300, 604800
        and 900 seconds respectively. type defaults to primary.


        Creating a zone also creates its apex NS record, pointed at
        soa_ns — RFC 2181 §10.1 requires an authoritative zone to carry NS
        records at its apex, so a zone is never left without one. That
        insert is best-effort: the zone itself is already committed by the
        time it runs, so a failure there is logged, not surfaced, and
        GET /zones/{id}/records is the way to confirm the NS record exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: apex domain name, e.g. example.com }
                type:
                  type: string
                  description: primary | secondary | stub | forwarder | internal; defaults to primary
                enabled: { type: boolean, default: true }
                soa_ns: { type: string, description: 'defaults to "ns.<name>"' }
                soa_mbox: { type: string, description: 'defaults to "hostadmin.<name>"' }
                soa_refresh: { type: integer, format: int64, description: seconds; defaults to 900 }
                soa_retry: { type: integer, format: int64, description: seconds; defaults to 300 }
                soa_expire: { type: integer, format: int64, description: seconds; defaults to 604800 }
                soa_minimum: { type: integer, format: int64, description: seconds; defaults to 900 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
        "400":
          description: >
            invalid json; name must be a valid domain name; or type is
            set to something other than primary ("only primary zones are
            supported")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "409":
          description: a zone with that name already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /zones/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Zones]
      summary: Get a zone
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [Zones]
      summary: Update a zone
      description: >
        Every property is optional; only fields present are changed. Same
        name validation as create applies when name is sent. soa_ttl is
        not editable here — see the Zone schema. type, if sent, must be
        primary, or the request is rejected with 400 regardless of the
        zone's current type.


        A zone of type internal — the RFC 6303 built-ins seeded at
        migration, see the Zone schema's type field — rejects the whole
        request with 409, checked right after the type validation above
        and before any field is applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: apex domain name, e.g. example.com }
                type: { type: string, description: primary | secondary | stub | forwarder | internal }
                enabled: { type: boolean }
                soa_ns: { type: string }
                soa_mbox: { type: string }
                soa_refresh: { type: integer, format: int64, description: seconds }
                soa_retry: { type: integer, format: int64, description: seconds }
                soa_expire: { type: integer, format: int64, description: seconds }
                soa_minimum: { type: integer, format: int64, description: seconds }
      responses:
        "204":
          description: No Content
        "400":
          description: >
            bad id, invalid json, name must be a valid domain name, or
            type is set to something other than primary ("only primary
            zones are supported")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            the zone is type internal ("built-in zones cannot be
            changed"); or a zone with that name already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Zones]
      summary: Delete a zone
      description: >
        Deletes every record in the zone along with it (ON DELETE
        CASCADE), and retires the PTR records those records owned from
        whichever reverse zone holds them — those live in a different
        zone, which the cascade cannot reach, and a PTR is only removed
        while it still points at the name being deleted, so a
        hand-written PTR or one owned by another zone's name survives. A
        zone of type internal — the RFC 6303 built-ins seeded at
        migration, see the Zone schema's type field — cannot be deleted;
        the request is rejected with 409.
      responses:
        "204":
          description: No Content
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: the zone is type internal ("built-in zones cannot be changed")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /zones/{id}/records:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, description: zone id }
    get:
      tags: [Zones]
      summary: List a zone's records
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ZoneRecord" }
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: zone not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Zones]
      summary: Create a record in a zone
      description: >
        Rejected with 409 before the body is even read if the zone is
        type internal — the RFC 6303 built-ins seeded at migration, see
        the Zone schema's type field.


        rdata is DNS presentation format — the rdata portion only, e.g.
        "192.168.150.28" for A, "10 mail.example.com." for MX, "0 issue
        \"letsencrypt.org\"" for CAA, or "host.example.com." for PTR (a
        domain name, RFC 1034 — not the address). It is validated by
        handing "<name> <ttl> IN <type> <rdata>" to the same DNS parser
        (miekg/dns) that builds the RR served to resolvers, so a 400 here
        carries that parser's own error text, not a generic message — any
        type it can parse is accepted without an API change, and an
        accepted record is by construction a servable one.


        name is zone-relative ("@", "bifrost", "*", "*.nexus"); omitted or
        equal to the zone's own name means the apex. A name that already
        carries the zone's apex as a suffix (e.g. "www.example.com" typed
        against zone "example.com") has that suffix stripped rather than
        doubled.


        Three write conflicts are rejected with 409 rather than accepted
        and left to break resolution later, checked in this order:
          - a CNAME at the zone apex (RFC 1912 §2.4)
          - a CNAME landing beside another record at the same name, or a
            record landing beside an existing CNAME, in either order
            (RFC 1034 §3.6.2 — a CNAME must be the only record at its name)
          - a TTL that doesn't match the rest of the RRSet already at this
            name and type (RFC 2181 §5.2 — every RR in an RRSet must share
            one TTL)


        If type is A or AAAA and enabled is not false, this write also
        maintains a matching PTR server-side, in the same request — no
        second call needed. (A record created with enabled: false gets no
        PTR: it answers nothing forward, so there is nothing for a
        reverse answer to mirror.) It writes the PTR only into a primary,
        enabled reverse zone that already covers the address (the most
        specific such zone wins); it never creates a zone, and it is
        silent when no reverse zone covers the address. If that address
        already has a PTR — from an earlier write or one entered by hand
        — the existing PTR is left alone; first writer keeps the address.
        This side effect can change a *different* zone's soa_serial with
        no direct write to that zone, and it never fails this request: if
        the PTR itself can't be written, only that is logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, rdata]
              properties:
                name: { type: string, description: 'zone-relative owner name; omitted means the apex ("@")' }
                type: { type: string, description: "DNS RR type, e.g. A, AAAA, CNAME, MX, TXT, CAA, NS, PTR" }
                ttl:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 2147483647
                  description: >
                    seconds; above 2147483647 is rejected (RFC 2181 §8 — a
                    resolver would read it back via two's-complement
                    wraparound, not as typed)
                rdata: { type: string, description: DNS presentation format, rdata portion only }
                enabled: { type: boolean, default: true }
                comment: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
        "400":
          description: >
            invalid json; ttl above 2147483647 (RFC 2181 §8); or rdata
            that fails to parse against name, ttl and type — message is
            the DNS parser's own error text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: zone not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            the zone is type internal ("built-in zones cannot be
            changed"), checked before the body is parsed; or, once the
            body is valid: CNAME at the zone apex (RFC 1912 §2.4); CNAME
            beside another record at the same name in either write order
            (RFC 1034 §3.6.2); or a TTL that doesn't match the rest of
            the RRSet at this name and type (RFC 2181 §5.2) — checked in
            that order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /zones/{id}/records/{rid}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, description: zone id }
      - name: rid
        in: path
        required: true
        schema: { type: integer, format: int64, description: record id }
    put:
      tags: [Zones]
      summary: Replace a record in a zone
      description: >
        Same rdata validation, 409 conflict rules, and auto-PTR side
        effect as POST /zones/{id}/records — see that operation's
        description, including for the internal-zone 409. rid must belong
        to the zone named by id, or the request 404s the same as an
        unknown record.


        If the record was type A or AAAA before this write, its old PTR
        is retired first — only while it still points at this record's
        old name — and this happens even when the address is unchanged,
        which is what lets a renamed record's PTR follow it to the new
        name. If the record is type A or AAAA after this write, its new
        PTR is then written under the same rules as
        POST /zones/{id}/records (first writer keeps an address; never
        creates a zone).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, rdata]
              properties:
                name: { type: string, description: 'zone-relative owner name; omitted means the apex ("@")' }
                type: { type: string, description: "DNS RR type, e.g. A, AAAA, CNAME, MX, TXT, CAA, NS, PTR" }
                ttl:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 2147483647
                  description: seconds; above 2147483647 is rejected (RFC 2181 §8)
                rdata: { type: string, description: DNS presentation format, rdata portion only }
                enabled: { type: boolean, default: true }
                comment: { type: string }
      responses:
        "204":
          description: No Content
        "400":
          description: >
            bad id, invalid json; ttl above 2147483647 (RFC 2181 §8); or
            rdata that fails to parse — message is the DNS parser's own
            error text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: zone not found, or rid is not a record of this zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            the zone is type internal ("built-in zones cannot be
            changed"), checked before the body is parsed; or, once the
            body is valid: CNAME at the zone apex (RFC 1912 §2.4); CNAME
            beside another record at the same name in either write order
            (RFC 1034 §3.6.2); or a TTL that doesn't match the rest of
            the RRSet at this name and type (RFC 2181 §5.2) — checked in
            that order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Zones]
      summary: Delete a record from a zone
      description: >
        rid must belong to the zone named by id, or the request 404s the
        same as an unknown record. Rejected with 409 if the zone is type
        internal — the RFC 6303 built-ins seeded at migration, see the
        Zone schema's type field.


        If the deleted record was type A or AAAA, this also removes its
        PTR from whichever reverse zone holds it — but only while that
        PTR still points at the deleted record's name; one repointed by
        hand, or by a later write to a different name, is left alone.
        This can change a *different* zone's soa_serial with no direct
        write to that zone, and it never fails this request: if the PTR
        can't be removed, only that is logged.
      responses:
        "204":
          description: No Content
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: zone not found, or rid is not a record of this zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: the zone is type internal ("built-in zones cannot be changed")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queries:
    get:
      tags: [Queries]
      summary: Search the query log
      parameters:
        - name: from
          in: query
          schema: { type: integer, format: int64, description: unix ms, inclusive lower bound }
        - name: to
          in: query
          schema: { type: integer, format: int64, description: unix ms, inclusive upper bound }
        - name: client
          in: query
          schema: { type: string, description: exact client IP }
        - name: q
          in: query
          schema: { type: string, description: substring match on query name }
        - name: decision
          in: query
          schema: { type: string, enum: [blocked, authoritative, cached, stale, forwarded, error], description: how the query was answered; `authoritative` is an answer from a zone this server holds }
        - name: type
          in: query
          schema: { type: string, description: DNS query type, e.g. A, AAAA }
        - name: limit
          in: query
          schema: { type: integer, description: 0 defaults to 100, capped at 1000 }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    at: { type: integer, format: int64, description: unix ms }
                    instance_id: { type: string }
                    client_ip: { type: string }
                    client_id: { type: integer, format: int64 }
                    q_name: { type: string }
                    q_type: { type: string }
                    decision: { type: string }
                    rule_id: { type: integer, format: int64 }
                    list_id: { type: integer, format: int64 }
                    upstream: { type: string }
                    r_code: { type: string }
                    duration_ms: { type: integer, format: int64 }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queries/tail:
    get:
      tags: [Queries]
      summary: Live-tail the query log as server-sent events
      description: >
        Streams newly-logged query entries as they occur. Each SSE
        "data:" line is a JSON-encoded query log entry (same shape as
        GET /queries items). The connection stays open until the client
        disconnects.
      responses:
        "200":
          description: text/event-stream of query log entries
          content:
            text/event-stream:
              schema: { type: string }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: streaming unsupported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: query log disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stats/overview:
    get:
      tags: [Stats]
      summary: Aggregate query counts over a recent window
      parameters:
        - name: hours
          in: query
          schema: { type: integer, description: lookback window; <=0 defaults to 24 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, format: int64 }
                  blocked: { type: integer, format: int64 }
                  cached: { type: integer, format: int64, description: cached + stale }
                  forwarded: { type: integer, format: int64 }
                  clients: { type: integer, format: int64, description: distinct client count }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stats/timeline:
    get:
      tags: [Stats]
      summary: Query decision counts bucketed over time
      parameters:
        - name: hours
          in: query
          schema: { type: integer, description: lookback window; <=0 defaults to 24 }
      responses:
        "200":
          description: OK, sorted ascending by bucket
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bucket: { type: integer, format: int64, description: unix seconds bucket start }
                    decisions:
                      type: object
                      description: decision -> count
                      additionalProperties: { type: integer, format: int64 }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /stats/top:
    get:
      tags: [Stats]
      summary: Top-N values for a metric over a recent window
      parameters:
        - name: metric
          in: query
          required: true
          schema: { type: string, enum: [domain, blocked_domain, client] }
        - name: n
          in: query
          schema: { type: integer, description: "<=0 defaults to 10, capped at 100" }
        - name: hours
          in: query
          schema: { type: integer, description: lookback window; <=0 defaults to 24 }
      responses:
        "200":
          description: OK, sorted descending by count
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    count: { type: integer, format: int64 }
        "400":
          description: metric must be domain, blocked_domain or client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tokens:
    get:
      tags: [Tokens]
      summary: List API tokens owned by the current user
      description: Session tokens are excluded; only kind=api tokens are returned. The token hash is never returned.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    user_id: { type: integer, format: int64 }
                    kind: { type: string, enum: [session, api] }
                    name: { type: string }
                    scope: { type: string, enum: [read, write] }
                    created_at: { type: integer, format: int64 }
                    expires_at: { type: integer, format: int64 }
                    last_used: { type: integer, format: int64 }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Tokens]
      summary: Create an API token
      description: The plaintext token is returned only in this response and cannot be retrieved again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                scope: { type: string, enum: [read, write], description: defaults to write when omitted }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  token: { type: string, description: plaintext token; shown once }
        "400":
          description: name required, or invalid scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"

  /tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Tokens]
      summary: Revoke an API token
      responses:
        "204":
          description: No Content
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
