openapi: 3.1.0
info:
  title: dnsaur API
  version: "1.0"
  description: >
    REST API for the dnsaur DNS/DHCP server. All paths are prefixed
    /api/v1. Authenticate with either the dnsaur_session cookie (set by
    POST /auth/login) or an Authorization: Bearer <token> API token
    (see /tokens). API tokens may have scope "read" (GET/HEAD only) or
    "write" (all methods); the session cookie always has full access.
    A read-scoped token used for a POST/PUT/PATCH/DELETE request is
    rejected with 403 {"error": "read-only token"} — see the 403
    response documented on each mutating operation below.
    There is no separate "upstreams" resource: upstream DNS servers are
    configured via the "upstreams" key in /settings (a comma-separated
    list), alongside "upstream.strategy".
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Meta
  - name: Setup
  - name: Auth
  - name: Settings
  - name: Blocking
  - name: Groups
  - name: Clients
  - name: Filters
  - name: Zones
  - name: Queries
  - name: Stats
  - name: Tokens
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dnsaur_session
      description: Session cookie set by POST /auth/login. HttpOnly, SameSite=Strict.
    bearerAuth:
      type: http
      scheme: bearer
      description: API token minted via POST /tokens, sent as "Authorization Bearer <token>".
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    List:
      type: object
      description: >
        A subscribed filter list. last_status is the field that says whether
        the list is actually enforcing anything: entry_count alone cannot
        tell "never fetched" from "fetched, but every line was rejected" —
        both read as 0.
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        name:
          type: string
          description: >
            Readable label, shown wherever the UI would otherwise print the
            raw URL (assignment menus, toasts, delete confirmations). Never
            empty on read: a list stored with a blank name resolves to one
            derived from its URL, which is also what labels rows written
            before this field existed.
        kind: { type: string, enum: [block, allow] }
        enabled: { type: boolean }
        last_refreshed:
          type: integer
          format: int64
          description: unix ms of the last successful fetch-and-parse; 0 = never
        entry_count:
          type: integer
          format: int64
          description: unique domains currently compiled and enforcing
        last_status:
          type: string
          enum: [pending, ok, stale, failed, empty]
          description: >
            pending — never attempted; the only case where 0 entries and a
            "never" last_refreshed are expected.
            ok — fetched (or 304'd) and parsed; entries are live.
            stale — this attempt failed, but a previously cached copy is
            still compiled and enforcing, so entries are real but ageing;
            last_refreshed dates the copy being served.
            failed — the attempt failed and there is no usable copy, so the
            list is blocking nothing.
            empty — fetched and parsed fine, but produced no usable entries
            (every line rejected, or the file holds no domains). Also
            blocking nothing, but for a parser reason rather than a fetch
            one; last_error says which.
        last_error:
          type: string
          description: >
            Short human-readable reason; "" when last_status is pending or ok.
        last_attempt:
          type: integer
          format: int64
          description: >
            unix ms of the last attempt, successful or not; 0 = never tried.
            Differs from last_refreshed on a failing list, which is what lets
            the UI say "tried 5m ago, still serving Tuesday's copy".
    Zone:
      type: object
      description: >
        An authoritative DNS zone: a claim of authority over a suffix, not
        an override on top of an upstream forwarder. A name the zone
        doesn't hold answers authoritative NXDOMAIN carrying this zone's
        SOA — it never falls through upstream.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: apex, lowercase, no trailing dot, e.g. example.com }
        type:
          type: string
          description: >
            primary | secondary | stub | forwarder | internal; defaults to
            primary. A reverse zone (for PTR records) is not a separate
            type — it is an ordinary primary zone whose apex happens to
            end in in-addr.arpa or ip6.arpa. internal is reserved for the
            RFC 6303 built-ins seeded at migration (localhost and the
            loopback/special-use reverse zones); it cannot be created or
            reassigned through this API, and every write to a zone of
            this type — PATCH, DELETE, or any write under
            /zones/{id}/records — is rejected with 409. secondary, stub
            and forwarder are accepted and stored but not yet acted on.
        enabled: { type: boolean }
        soa_ns: { type: string }
        soa_mbox: { type: string }
        soa_serial: { type: integer, format: int64 }
        soa_refresh: { type: integer, format: int64, description: seconds }
        soa_retry: { type: integer, format: int64, description: seconds }
        soa_expire: { type: integer, format: int64, description: seconds }
        soa_minimum:
          type: integer
          format: int64
          description: >
            seconds; the negative-cache TTL for NXDOMAINs this zone hands
            out (RFC 2308), not a floor on positive answers.
        soa_ttl:
          type: integer
          format: int64
          description: >
            seconds; the SOA record's own header TTL, distinct from
            soa_minimum. Fixed at 900 in Milestone A — there is no request
            field to set it, on create or patch.
        primaries: { type: string, description: secondary/stub/forwarder only; unused and empty for primary/internal }
        tsig_key_id: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64, description: unix ms; secondary only, 0 otherwise }
        refreshed_at: { type: integer, format: int64, description: unix ms; secondary only, 0 otherwise }
        created_at: { type: integer, format: int64 }
        modified_at: { type: integer, format: int64 }
    ZoneRecord:
      type: object
      description: >
        One resource record within a zone, named relative to the zone's
        apex.
      properties:
        id: { type: integer, format: int64 }
        zone_id: { type: integer, format: int64 }
        name:
          type: string
          description: >
            Owner name relative to the zone apex: "@" for the apex itself,
            "bifrost", "*", "*.nexus".
        type: { type: string, description: "DNS RR type, e.g. A, AAAA, CNAME, MX, TXT, CAA, NS, PTR" }
        ttl: { type: integer, format: int64, description: seconds }
        rdata:
          type: string
          description: >
            DNS presentation format, rdata portion only — "192.168.150.28"
            for A, "10 mail.example.com." for MX, "0 issue
            \"letsencrypt.org\"" for CAA, "host.example.com." for PTR (a
            domain name, RFC 1034 — not the address itself).
        enabled: { type: boolean }
        comment: { type: string }
  responses:
    ReadOnlyToken:
      description: read-only token used for a write operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
paths:
  /health:
    get:
      tags: [Meta]
      security: []
      summary: Liveness and version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }

  /openapi.yaml:
    get:
      tags: [Meta]
      security: []
      summary: This OpenAPI 3.1 document
      responses:
        "200":
          description: OK
          content:
            application/yaml:
              schema: { type: string }

  /setup:
    get:
      tags: [Setup]
      security: []
      summary: Whether first-run setup is required
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup_required: { type: boolean }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Setup]
      security: []
      summary: Create the admin account (first run only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, minLength: 8 }
                totp_code: { type: string, description: unused on setup }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: created }
        "400":
          description: "invalid input: username required, or password must be at least 8 characters"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: setup already completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Log in and receive a session cookie
      description: >
        On success, sets the dnsaur_session cookie (HttpOnly, SameSite=Strict,
        30-day TTL). If the account has TOTP enabled, totp_code must be
        supplied or the request fails with 428. If first-run setup hasn't
        completed yet, the request fails with 409 instead of being
        evaluated against the (empty) users table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                totp_code: { type: string }
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema: { type: string }
              description: dnsaur_session=<token>; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "400":
          description: invalid json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: bad credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "428":
          description: totp code required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: setup required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out and clear the session cookie
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema: { type: string }
              description: dnsaur_session cleared (Max-Age -1)
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"

  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  username: { type: string }
                  totp_enabled: { type: boolean }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/totp/start:
    post:
      tags: [Auth]
      summary: Begin enrolling TOTP for the current user
      description: Generates a new secret; must be confirmed via /auth/totp/confirm to take effect.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: base32 TOTP secret }
                  otpauth_url: { type: string, description: otpauth:// URL for QR-code enrollment }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "500":
          description: totp generation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/totp/confirm:
    post:
      tags: [Auth]
      summary: Confirm and enable TOTP with a code from the secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, code]
              properties:
                secret: { type: string }
                code: { type: string }
      responses:
        "204":
          description: No Content, TOTP now enabled
        "400":
          description: invalid json or wrong code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"

  /auth/totp/disable:
    post:
      tags: [Auth]
      summary: Disable TOTP for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "204":
          description: No Content, TOTP now disabled
        "400":
          description: invalid json or wrong code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"

  /settings:
    get:
      tags: [Settings]
      summary: All editable settings as a flat key-value map
      description: >
        Keys with the "instance." and "stats." prefixes are internal and
        omitted. The "upstreams" key holds a comma-separated list of
        upstream DNS servers; there is no separate /upstreams resource.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: setting key -> string value
                additionalProperties: { type: string }
                example:
                  upstreams: "1.1.1.1:53,9.9.9.9:53"
                  upstream.strategy: failover
                  blocking.mode: null-ip
                  blocking.ttl: "300"
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [Settings]
      summary: Set a single setting
      description: >
        Editable keys: upstreams, upstream.strategy (failover|fastest|race),
        blocking.mode (null-ip|nxdomain), blocking.ttl (non-negative int),
        cache.min_ttl, cache.max_ttl, cache.max_entries,
        cache.serve_stale_for (non-negative ints), lists.refresh_hours
        (non-negative int), qlog.retention_days (non-negative int),
        qlog.privacy (full|anon|none). All other keys are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  enum:
                    - upstreams
                    - upstream.strategy
                    - blocking.mode
                    - blocking.ttl
                    - cache.min_ttl
                    - cache.max_ttl
                    - cache.max_entries
                    - cache.serve_stale_for
                    - lists.refresh_hours
                    - qlog.retention_days
                    - qlog.privacy
                value: { type: string }
      responses:
        "204":
          description: No Content
        "400":
          description: setting not editable, or invalid value for the key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /blocking:
    get:
      tags: [Blocking]
      summary: Whether blocking is currently paused for a group
      parameters:
        - name: group_id
          in: query
          required: false
          schema: { type: integer, format: int64, description: defaults to 0 when omitted }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  paused_until:
                    type: integer
                    format: int64
                    description: unix ms when the pause ends, or 0 if not paused
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /blocking/pause:
    post:
      tags: [Blocking]
      summary: Pause blocking for a group for N minutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, minutes]
              properties:
                group_id: { type: integer, format: int64 }
                minutes: { type: integer, minimum: 1, maximum: 1440 }
      responses:
        "204":
          description: No Content
        "400":
          description: minutes must be 1-1440
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
    delete:
      tags: [Blocking]
      summary: Resume blocking for a group (cancel a pause)
      parameters:
        - name: group_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204":
          description: No Content
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"

  /groups:
    get:
      tags: [Groups]
      summary: List client groups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    name: { type: string }
                    enabled: { type: boolean }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Groups]
      summary: Create a client group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                enabled:
                  type: boolean
                  default: true
                  description: >
                    Omitted means enabled. A disabled group compiles no
                    ruleset, so nothing is filtered for any client in it.
                list_ids:
                  type: array
                  items: { type: integer, format: int64 }
                  description: >
                    The exact set of lists to assign, an empty array
                    included — "assign nothing" is a real choice. Omitted
                    assigns every list that exists, because a group with
                    none filters nothing at all.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
        "400":
          description: name required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"

  /groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Groups]
      summary: Rename and/or enable/disable a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: if present, must be non-empty }
                enabled: { type: boolean }
      responses:
        "204":
          description: No Content
        "400":
          description: bad id, name cannot be empty, or invalid json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Groups]
      summary: Delete a group
      responses:
        "204":
          description: No Content
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "404":
          description: not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: resource in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{id}/lists:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Groups, Filters]
      summary: Filter lists assigned to a group
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/List" }
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [Groups, Filters]
      summary: Replace the set of filter lists assigned to a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [list_ids]
              properties:
                list_ids:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "204":
          description: No Content
        "400":
          description: bad id or invalid json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"

  /groups/{id}/rules:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Groups, Filters]
      summary: Per-group allow/block rules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    group_id: { type: integer, format: int64 }
                    action: { type: string, enum: [allow, block] }
                    pattern: { type: string }
                    is_regex: { type: boolean }
        "400":
          description: bad id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Groups, Filters]
      summary: Add a rule to a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, pattern]
              properties:
                action: { type: string, enum: [allow, block] }
                pattern:
                  type: string
                  description: literal domain, or a regex when is_regex is true (max 512 chars)
                is_regex: { type: boolean, default: false }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
        "400":
          description: >
            bad id; action allow|block and pattern required; regex pattern
            too long (max 512); or invalid regex
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"

  /clients:
    get:
      tags: [Clients]
      summary: List clients
      responses:
        "200":
          description: OK
