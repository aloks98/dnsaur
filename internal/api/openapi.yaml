openapi: 3.1.0
info:
  title: dnsaur API
  version: "1.0"
  description: >
    REST API for the dnsaur DNS/DHCP server. All paths are prefixed
    /api/v1. Authenticate with either the dnsaur_session cookie (set by
    POST /auth/login) or an Authorization: Bearer <token> API token
    (see /tokens). API tokens may have scope "read" (GET/HEAD only) or
    "write" (all methods); the session cookie always has full access.
    A read-scoped token used for a POST/PUT/PATCH/DELETE request is
    rejected with 403 {"error": "read-only token"} — see the 403
    response documented on each mutating operation below.
    There is no separate "upstreams" resource: upstream DNS servers are
    configured via the "upstreams" key in /settings (a comma-separated
    list), alongside "upstream.strategy". Each entry is plain by default
    ("1.1.1.1:53") or, with a scheme, DNS-over-TLS
    ("tls://1.1.1.1:853#cloudflare-dns.com") or DNS-over-HTTPS
    ("https://1.1.1.1/dns-query#cloudflare-dns.com") — see the "upstreams"
    key under PUT /settings for the full grammar.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Meta
  - name: Setup
  - name: Auth
  - name: Settings
  - name: Blocking
  - name: Groups
  - name: Clients
  - name: Filters
  - name: Zones
  - name: Queries
  - name: Stats
  - name: Tokens
  - name: TSIG Keys
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dnsaur_session
      description: Session cookie set by POST /auth/login. HttpOnly, SameSite=Strict.
    bearerAuth:
      type: http
      scheme: bearer
      description: API token minted via POST /tokens, sent as "Authorization Bearer <token>".
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    ProtocolStatus:
      type: object
      description: >
        One encrypted protocol's intent and reality, from GET
        /resolver/status. enabled is what the setting says; listening is
        whether a socket is actually open right now — they can disagree, and
        that disagreement is the whole point of reporting both.
      properties:
        enabled: { type: boolean }
        listening: { type: boolean }
        addr:
          type: string
          description: the configured listen address, whether or not the bind succeeded
        error:
          type: string
          description: the bind failure, present only when enabled && !listening
    List:
      type: object
      description: >
        A subscribed filter list. last_status is the field that says whether
        the list is actually enforcing anything: entry_count alone cannot
        tell "never fetched" from "fetched, but every line was rejected" —
        both read as 0.
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        name:
          type: string
          description: >
            Readable label, shown wherever the UI would otherwise print the
            raw URL (assignment menus, toasts, delete confirmations). Never
            empty on read: a list stored with a blank name resolves to one
            derived from its URL, which is also what labels rows written
            before this field existed.
        kind: { type: string, enum: [block, allow] }
        enabled: { type: boolean }
        last_refreshed:
          type: integer
          format: int64
          description: unix ms of the last successful fetch-and-parse; 0 = never
        entry_count:
          type: integer
          format: int64
          description: unique domains currently compiled and enforcing
        last_status:
          type: string
          enum: [pending, ok, stale, failed, empty]
          description: >
            pending — never attempted; the only case where 0 entries and a
            "never" last_refreshed are expected.
            ok — fetched (or 304'd) and parsed; entries are live.
            stale — this attempt failed, but a previously cached copy is
            still compiled and enforcing, so entries are real but ageing;
            last_refreshed dates the copy being served.
            failed — the attempt failed and there is no usable copy, so the
            list is blocking nothing.
            empty — fetched and parsed fine, but produced no usable entries
            (every line rejected, or the file holds no domains). Also
            blocking nothing, but for a parser reason rather than a fetch
            one; last_error says which.
        last_error:
          type: string
          description: >
            Short human-readable reason; "" when last_status is pending or ok.
        last_attempt:
          type: integer
          format: int64
          description: >
            unix ms of the last attempt, successful or not; 0 = never tried.
            Differs from last_refreshed on a failing list, which is what lets
            the UI say "tried 5m ago, still serving Tuesday's copy".
    Zone:
      type: object
      description: >
        An authoritative DNS zone: a claim of authority over a suffix, not
        an override on top of an upstream forwarder. A name the zone
        doesn't hold answers authoritative NXDOMAIN carrying this zone's
        SOA — it never falls through upstream.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: apex, lowercase, no trailing dot, e.g. example.com }
        type:
          type: string
          description: >
            primary | secondary | stub | forwarder | internal; defaults to
            primary. A reverse zone (for PTR records) is not a separate
            type — it is an ordinary primary zone whose apex happens to
            end in in-addr.arpa or ip6.arpa. internal is reserved for the
            RFC 6303 built-ins seeded at migration (localhost and the
            loopback/special-use reverse zones); it cannot be created or
            reassigned through this API, and every write to a zone of
            this type — PATCH, DELETE, or any write under
            /zones/{id}/records — is rejected with 409.


            primary, secondary, forwarder and stub are the four this API
            creates or patches into; internal is rejected with 400. A
            secondary is filled by transfer from its primaries and is
            created empty — no apex NS record is seeded for it, unlike
            a primary. Its records are read-only through this API: every
            write under /zones/{id}/records, and a zone file import, is
            rejected with 409, because a transfer replaces the whole zone
            and would delete the write at the next refresh. The zone
            itself stays editable — PATCH and DELETE work, and that is how
            its primaries and TSIG key are changed.


            A stub fetches its NS set from primaries by ordinary query
            rather than transfer, and — like a secondary — may sign that
            query with tsig_key_id. Its records are read-only through this
            API on the same terms and for the same reason: the fetch
            replaces the whole set, so every write under /zones/{id}/records
            and a zone file import are rejected with 409. A forwarder
            answers nothing of its own:
            it claims the suffix and sends every query beneath it to
            forward_to, so a name it has no answer for is a SERVFAIL, not a
            fall-through past dnsaur. Creating, patching, deleting or
            disabling either type also drops whatever the cache held for the
            suffix whose routing changed, so a claimed suffix is never
            answered from an entry the default upstreams produced before the
            claim existed, and a released one stops answering from the
            entries its own upstreams produced.
            Neither stub nor forwarder serves a
            zone or has secondaries, so allow_transfer and notify_to stay
            refused on both, and neither gets an apex NS record seeded.


            Until its first transfer lands (refreshed_at is 0), and again
            once its data has expired, a secondary answers SERVFAIL for
            every name beneath its apex rather than an authoritative
            NXDOMAIN: it holds nothing it is entitled to speak for, and a
            denial would assert that those names do not exist.
        enabled: { type: boolean }
        soa_ns: { type: string }
        soa_mbox: { type: string }
        soa_serial: { type: integer, format: int64 }
        soa_refresh: { type: integer, format: int64, description: seconds }
        soa_retry: { type: integer, format: int64, description: seconds }
        soa_expire: { type: integer, format: int64, description: seconds }
        soa_minimum:
          type: integer
          format: int64
          description: >
            seconds; the negative-cache TTL for NXDOMAINs this zone hands
            out (RFC 2308), not a floor on positive answers.
        soa_ttl:
          type: integer
          format: int64
          description: >
            seconds; the SOA record's own header TTL, distinct from
            soa_minimum. Fixed at 900 in Milestone A — there is no request
            field to set it, on create or patch.
        primaries:
          type: string
          description: >
            Where a secondary transfers the zone from, or a stub fetches
            its NS set from by ordinary query: a comma-separated list
            of host[:port], port defaulting to 53, where host is an IP
            address or a domain name — "192.168.150.5",
            "192.168.150.5:5353, ns1.upstream.example", "[2001:db8::1]:5353".


            Stored exactly as written and resolved at transfer/query time,
            not at write: a primary named by hostname has to survive its
            address changing, and a primary that is unreachable right now
            must not block the zone from being configured. Required and
            non-empty for a secondary or stub; must be empty on every
            other type.
        tsig_key_id:
          type: integer
          format: int64
          description: >
            The TSIG key a secondary signs its transfer requests with, or
            a stub signs its SOA/NS queries with; 0 means unsigned.
            Optional, but when set it must name a key that exists, and
            while a zone names it that key cannot be deleted (DELETE
            /tsig-keys/{id} answers 409). Must be 0 on every type other
            than secondary and stub.
        expires_at:
          type: integer
          format: int64
          description: >
            unix ms the copy this zone holds stops being servable; secondary
            only, 0 on every other type. A stub is never given one, and that
            is deliberate rather than an omission: its NS set is routing
            information, not data held on loan, and an old-but-working
            nameserver beats a self-inflicted SERVFAIL. Only a secondary's own
            attempt writes this — a transfer, or a scheduled check whose SOA
            probe found the primary already at this zone's serial, which RFC
            1034 section 4.3.5 restarts the expire timer for either way — so
            unlike refreshed_at below it does not widen to the stub, and a row
            retyped from secondary to stub still carries whatever value it
            had, which is why a client must not read it for any type but
            secondary.
        refreshed_at:
          type: integer
          format: int64
          description: >
            unix ms of the last attempt against a master that succeeded — a
            secondary's transfer, a stub's NS fetch, or a scheduled check
            whose SOA probe found the secondary already current, which is
            the primary confirming what the zone holds and counts as the
            refresh it is; 0 = never. Written by both types, unlike
            expires_at, which is a secondary's alone.
            Distinct from last_attempt, which dates the last pull that was
            tried. Written for a secondary and a stub; 0 on a type that has
            never pulled. Like expires_at, a retyped row keeps whatever it
            already had, so read it only for the types that write it.
        last_error:
          type: string
          description: >
            Why the most recent pull failed, in the transfer's or fetch's
            own words, or "" when it succeeded. Cleared on success, so a
            zone that recovered stops reporting one, and written together
            with last_attempt in a single statement so the two can never
            disagree. Read-only: no request body sets it. Written for a
            secondary and a stub; like expires_at, a retyped row keeps
            whatever it already had, so read it only for those types.
        last_attempt:
          type: integer
          format: int64
          description: >
            unix ms of the last pull attempted, successful or not;
            0 = never attempted. Only meaningful read beside last_error,
            which without a date is a claim about the present made by an
            unknown past. Read-only. Written for a secondary and a stub;
            like expires_at, a retyped row keeps whatever it already had.
        allow_transfer:
          type: string
          description: >
            Who may pull this zone by AXFR: a comma-separated list where
            each entry is an IP address, a CIDR prefix, or key:<tsig-name>
            (a request signed under that TSIG key) — e.g.
            "10.0.0.0/24, 192.168.1.5, key:secondary-ns2.". Empty means
            deny every transfer, which is the default. Applies to both
            primary and secondary zones — a secondary re-serves what it
            pulled — unlike primaries, which is secondary-only. Must be
            empty on a stub or forwarder: neither serves a zone.


            Stored and read back in its canonical spelling (lowercase key
            names, fully qualified, ", "-separated), which may differ from
            what was written even though it means the same thing. A
            key:<name> entry must name a TSIG key that exists.
        last_xfr_at:
          type: integer
          format: int64
          description: >
            unix ms of the last time a peer asked this server to transfer
            the zone, successful or not; 0 = never. The outbound twin of
            last_attempt. Read-only.
        last_xfr_peer:
          type: string
          description: >
            The address of the peer from the most recent outbound transfer
            request, "" when none has ever been made. Read-only.
        last_xfr_error:
          type: string
          description: >
            Why the most recent outbound transfer request was refused, in
            the server's own words, or "" when it was served. The outbound
            twin of last_error. Read-only.
        notify_to:
          type: string
          description: >
            Who this zone tells when it changes (DNS NOTIFY, RFC 1996): a
            comma-separated list where each entry is host[:port] (port
            defaulting to 53) with an optional key:<tsig-name> suffix to
            sign that target's NOTIFY — e.g. "10.0.0.2, 10.0.0.3:5353
            key:secondary-ns2.". Empty means notify nobody, which is the
            default. Applies to both primary and secondary zones — a
            secondary that re-serves what it pulled has its own downstream
            secondaries — unlike primaries and tsig_key_id, which are
            secondary-only. Must be empty on a stub or forwarder: neither
            serves a zone.


            Stored and read back in its canonical spelling (the port always
            explicit, lowercase key names, fully qualified, ", "-separated),
            which may differ from what was written even though it means
            the same thing. A key:<name> entry must name a TSIG key that
            exists.
        forward_to:
          type: string
          description: >
            Where a forwarder zone sends the queries it claims: a
            comma-separated list of host[:port], port defaulting to 53 —
            e.g. "10.0.0.1, 10.0.0.2:5353". Empty means the zone names no
            upstreams, which makes every query beneath it a SERVFAIL
            rather than a fall-through past dnsaur — the zone still claims
            the suffix. Changing this list drops whatever the cache held
            beneath the zone's apex, so the addresses you just removed stop
            answering for it. Applies to forwarder only; must be empty on every
            other type.


            Stored and read back in its canonical spelling (the port
            always explicit, ", "-separated), which may differ from what
            was written even though it means the same thing.
        created_at: { type: integer, format: int64 }
        modified_at: { type: integer, format: int64 }
    ZoneRecord:
      type: object
      description: >
        One resource record within a zone, named relative to the zone's
        apex.
      properties:
        id: { type: integer, format: int64 }
        zone_id: { type: integer, format: int64 }
        name:
          type: string
          description: >
            Owner name relative to the zone apex: "@" for the apex itself,
            "bifrost", "*", "*.nexus".
        type: { type: string, description: "DNS RR type, e.g. A, AAAA, CNAME, MX, TXT, CAA, NS, PTR" }
        ttl: { type: integer, format: int64, description: seconds }
        rdata:
          type: string
          description: >
            DNS presentation format, rdata portion only — "192.168.150.28"
            for A, "10 mail.example.com." for MX, "0 issue
            \"letsencrypt.org\"" for CAA, "host.example.com." for PTR (a
            domain name, RFC 1034 — not the address itself).


            On read this is the DNS parser's own spelling of the value,
            which is not necessarily the string that was written: a name
            gains its trailing dot, a bare TXT value gains its quotes, an
            IPv6 address contracts. See the rdata note on POST
            /zones/{id}/records.
        enabled: { type: boolean }
        comment: { type: string }
    ZoneFileImportResult:
      type: object
      description: >
        The result of a zone file import: the three-way diff between the
        zone as it is and the file as it would replace it, or — when the
        file was rejected — one message per problem and three empty lists.

        A dry run returns exactly what a commit of the same file would do.
      required: [add, change, delete, errors]
      properties:
        add:
          type: array
          description: records in the file that the zone does not have.
          items: { $ref: "#/components/schemas/ZoneRecord" }
        change:
          type: array
          description: >
            records the file keeps but alters. Records are matched by name,
            type and rdata, so only ttl and enabled can differ; anything
            else is a delete plus an add.
          items:
            type: object
            required: [from, to]
            properties:
              from: { $ref: "#/components/schemas/ZoneRecord" }
              to: { $ref: "#/components/schemas/ZoneRecord" }
        delete:
          type: array
          description: >
            records the zone has and the file does not. A zone file is the
            zone, not a patch — anything absent from it goes, disabled
            records included (a master file cannot express "present but
            disabled", so export omits them and import cannot see them).
          items: { $ref: "#/components/schemas/ZoneRecord" }
        errors:
          type: array
          description: >
            One message per problem, empty on success. Each names the
            master-file line it is about ("line 12: ..."), except for a
            record whose line cannot be attributed — every record of a file
            using $GENERATE, which produces any number of records from one
            line — which is named by its name, type and rdata instead.
          items: { type: string }
        error:
          type: string
          description: >
            A one-line summary, present only when the file was rejected, so
            that a rejection also satisfies the flat {"error": "..."}
            envelope every other endpoint answers errors with. It does not
            replace errors, which is where the per-problem detail is.
    TSIGKey:
      type: object
      description: >
        A TSIG key (RFC 8945) authenticates a zone transfer between this
        server and a peer -- the credential a secondary presents to pull a
        zone, or this server presents when it is the one transferring.
      properties:
        id: { type: integer, format: int64 }
        name:
          type: string
          description: >
            The TSIG RR's owner name, canonical form (lowercase, trailing
            dot) -- e.g. "xfer.e412.in.". Normalised with the same rule on
            every write, so a signed message's owner name can never miss the
            key it names on case or a missing dot. Must be unique: it is the
            only thing a signed message carries to say which key signed it.
        algorithm:
          type: string
          enum: [hmac-sha1., hmac-sha224., hmac-sha256., hmac-sha384., hmac-sha512.]
          description: >
            miekg/dns's own algorithm names, trailing dot included.
            hmac-md5.sig-alg.reg.int. is a real RFC 8945 registry name but is
            rejected here: the library removed MD5 support from its signer,
            so a key created with it would parse and store fine and then
            fail to sign the first transfer it was needed for.
        secret:
          type: string
          description: >
            Base64, and returned in the clear on every read -- not hidden
            the way a freshly minted API token is. An API token only ever
            needs to be shown once, because only the holder who requested it
            uses it again. A TSIG secret is different: the same value has to
            be configured identically on the peer (BIND's key{} clause,
            Technitium's transfer settings), so a caller must be able to
            come back and read it whenever that peer needs re-pairing.
            Hiding it after creation would make the feature unusable without
            direct database access.
        created_at: { type: integer, format: int64, description: unix ms }
    ZoneNotify:
      type: object
      description: >
        One notify_to target's outbound NOTIFY (RFC 1996) delivery state —
        also its queue entry, since pending-ness is derived from the serial
        rather than stored separately.
      properties:
        target:
          type: string
          description: >
            host:port, as written in the zone's notify_to (port always
            explicit). Carries no key; it is the row identity.
        state:
          type: string
          enum: [never, current, retrying, gave_up]
          description: >
            Derived server-side from notified_at, notified_serial and
            attempts against the zone's current soa_serial — never left to
            the client to infer from those columns, so two clients can
            never compute it differently.


            never — no round has ever landed and none has ever been tried
            (attempts is 0). The only state where notified_at is 0 and
            attempts has not exhausted the budget.

            current — the target has acknowledged the zone's present
            soa_serial (RFC 1982 comparison, so a wrapped serial is never
            mistaken for current).

            retrying — behind the zone's current serial, and attempts
            within max_attempts.

            gave_up — behind the zone's current serial, and attempts has
            reached max_attempts. This includes a target that has never
            been delivered at all: never delivered and exhausted is
            gave_up, not never — reading notified_at alone would show a
            target that has failed max_attempts times as though nothing
            had been tried.
        notified_serial:
          type: integer
          format: int64
          description: >
            The last serial this target acknowledged; meaningless (0) until
            notified_at is non-zero.
        notified_at:
          type: integer
          format: int64
          description: unix ms of the last round that landed; 0 = never delivered.
        attempts:
          type: integer
          description: >
            How many times the current round has been tried. Reset to 0 by
            a delivery that lands; see max_attempts for the budget it is
            compared against.
        max_attempts:
          type: integer
          description: >
            The round budget (a server constant, currently 5) attempts is
            compared against — sent alongside attempts so the dashboard's
            "try 3/5" never hardcodes the denominator.
        last_error:
          type: string
          description: >
            The most recent failure, in the sender's own words; "" when the
            last attempt delivered or none has been tried.
        created_at:
          type: integer
          format: int64
          description: >
            unix ms this target was first seen (added to notify_to and
            reconciled into the queue). Never moves after; it is what dates
            a target whose state is still never.
  responses:
    ReadOnlyToken:
      description: read-only token used for a write operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
paths:
  /health:
    get:
      tags: [Meta]
      security: []
      summary: Liveness and version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }

  /openapi.yaml:
    get:
      tags: [Meta]
      security: []
      summary: This OpenAPI 3.1 document
      responses:
        "200":
          description: OK
          content:
            application/yaml:
              schema: { type: string }

  /setup:
    get:
      tags: [Setup]
      security: []
      summary: Whether first-run setup is required
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup_required: { type: boolean }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Setup]
      security: []
      summary: Create the admin account (first run only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, minLength: 8 }
                totp_code: { type: string, description: unused on setup }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: created }
        "400":
          description: "invalid input: username required, or password must be at least 8 characters"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: setup already completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Log in and receive a session cookie
      description: >
        On success, sets the dnsaur_session cookie (HttpOnly, SameSite=Strict,
        30-day TTL). If the account has TOTP enabled, totp_code must be
        supplied or the request fails with 428. If first-run setup hasn't
        completed yet, the request fails with 409 instead of being
        evaluated against the (empty) users table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                totp_code: { type: string }
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema: { type: string }
              description: dnsaur_session=<token>; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "400":
          description: invalid json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: bad credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "428":
          description: totp code required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: setup required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out and clear the session cookie
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema: { type: string }
              description: dnsaur_session cleared (Max-Age -1)
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"

