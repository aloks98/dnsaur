  /resolver/status:
    get:
      tags: [Settings]
      summary: State of the running resolver that is not a setting
      description: >
        Server state, deliberately kept out of GET /settings, whose response
        is a flat map of settings only.


        "encryption_downgraded" is true when the stored "upstreams" value
        named tls:// or https://, failed to parse at startup or on a settings
        reload, and the server fell back to its hardcoded plaintext default
        resolvers — so queries are travelling in the clear while the settings
        page still shows the operator's encrypted value. "reason" carries the
        parse failure. It clears as soon as a later settings apply installs a
        forwarder built from the stored value.


        "serving" reports DoT and DoH separately: each carries "enabled" (what
        serve.{dot,doh}.enabled says) and "listening" (whether a socket is
        actually open right now). The two are allowed to disagree — a
        privileged port already taken by something else, or a certificate
        that stopped being readable, leaves enabled true and listening false
        — and "error" carries the bind failure in that case.


        "certificate" is present only once a certificate has actually loaded
        successfully; it is absent on a fresh install or while the configured
        pair has never once read cleanly, which is a different fact from
        "expires soon" and is never reported as a false warning. When present,
        "expiring_soon" is true when "not_after" falls within a fixed 14-day
        warning window — a constant, not a configurable setting.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  encryption_downgraded: { type: boolean }
                  reason:
                    type: string
                    description: why the value would not parse; empty when nothing is wrong
                  serving:
                    type: object
                    properties:
                      dot: { $ref: "#/components/schemas/ProtocolStatus" }
                      doh: { $ref: "#/components/schemas/ProtocolStatus" }
                  certificate:
                    type: object
                    description: absent when no certificate has ever loaded successfully
                    properties:
                      not_after: { type: string, format: date-time }
                      expiring_soon:
                        type: boolean
                        description: true when not_after falls within the 14-day warning window
                example:
                  encryption_downgraded: true
                  reason: 'upstream "tls://1.1.1.1:853": missing "#name"'
                  serving:
                    dot: { enabled: true, listening: true, addr: "0.0.0.0:853" }
                    doh: { enabled: true, listening: false, addr: "0.0.0.0:443", error: "listen tcp :443: bind: permission denied" }
                  certificate:
                    not_after: "2026-10-01T00:00:00Z"
                    expiring_soon: false
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /settings:
    get:
      tags: [Settings]
      summary: All editable settings as a flat key-value map
      description: >
        Keys with the "instance." and "stats." prefixes are internal and
        omitted. The "upstreams" key holds a comma-separated list of
        upstream DNS servers, each plain or, with a scheme and "#name",
        DNS-over-TLS or DNS-over-HTTPS (see PUT /settings for the
        grammar); there is no separate /upstreams resource.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: setting key -> string value
                additionalProperties: { type: string }
                example:
                  upstreams: "1.1.1.1:53,9.9.9.9:53"
                  upstream.strategy: failover
                  blocking.mode: null-ip
                  blocking.ttl: "300"
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [Settings]
      summary: Set a single setting
      description: >
        Editable keys: upstreams, upstream.strategy (failover|fastest|race),
        blocking.mode (null-ip|nxdomain), blocking.ttl (non-negative int),
        cache.min_ttl, cache.max_ttl, cache.max_entries,
        cache.serve_stale_for (non-negative ints), lists.refresh_hours
        (int, 1 or more — it becomes a tick interval, and 0 is not a
        schedule), qlog.retention_days (non-negative int),
        qlog.privacy (full|anon|none), stats.retention_days (int, 1 or
        more — 0 would prune every hourly bucket there is),
        serve.dot.enabled, serve.doh.enabled
        ("true" or "false", exactly those two strings), serve.dot.listen,
        serve.doh.listen ("host:port", host may be empty for all
        interfaces, port numeric 1-65535), serve.tls.cert, serve.tls.key
        (an absolute path, or empty to unset). All other keys are rejected.


        "upstreams" is a comma-separated list of entries, each plain
        ("1.1.1.1:53", or "udp://1.1.1.1:53" with the scheme written out),
        DNS-over-TLS ("tls://1.1.1.1:853#cloudflare-dns.com"), or
        DNS-over-HTTPS ("https://1.1.1.1/dns-query#cloudflare-dns.com").
        Ports default to 53/853/443 and the DoH path defaults to
        "/dns-query". For tls:// and https:// the host must be an IP
        literal and "#name" (the name the certificate must present) is
        required; "#name" on a plain entry is rejected; every entry in
        the list must share one scheme. A value that fails this grammar
        is rejected with 400 and a reason naming the problem, rather than
        being accepted and silently dropped at the next restart.


        Setting "serve.dot.enabled" or "serve.doh.enabled" to "true"
        additionally requires "serve.tls.cert" and "serve.tls.key" to
        already both be set to an absolute path and to load as a matching
        keypair (the same check the listener itself makes before
        binding). The rejection names this explicitly ("set
        serve.tls.cert and serve.tls.key first") rather than a bare
        "invalid value", since the fields that make the write valid are
        not the field being written. Setting either to "false" never has
        this requirement. Saving "serve.tls.cert" or "serve.tls.key" once
        both halves are set runs the same pair check, regardless of
        whether a protocol is currently enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  enum:
                    - upstreams
                    - upstream.strategy
                    - blocking.mode
                    - blocking.ttl
                    - cache.min_ttl
                    - cache.max_ttl
                    - cache.max_entries
                    - cache.serve_stale_for
                    - lists.refresh_hours
                    - qlog.retention_days
                    - qlog.privacy
                    - serve.dot.enabled
                    - serve.dot.listen
                    - serve.doh.enabled
                    - serve.doh.listen
                    - serve.tls.cert
                    - serve.tls.key
                value: { type: string }
      responses:
        "204":
          description: No Content
        "400":
          description: setting not editable, or invalid value for the key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/ReadOnlyToken"
        "503":
          description: storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

