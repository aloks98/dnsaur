      description: >
        Adding a list refreshes filters asynchronously after the response
        (the same as POST /filters/refresh): the list row is created and
        its id returned immediately, and the potentially slow full-network
        refresh runs in the background.


        The new list is also assigned to every existing group. A group's
        ruleset compiles only from the lists assigned to it, so a list that
        exists but is assigned nowhere filters nothing while still reporting
